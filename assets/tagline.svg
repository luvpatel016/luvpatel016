<svg xmlns="http://www.w3.org/2000/svg" width="600" height="60" viewBox="0 0 600 60">
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur">
        <animate attributeName="stdDeviation" values="1.5;5;1.5" dur="2.5s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="c1"><rect class="r1" x="90" y="0" width="0" height="60"/></clipPath>
    <clipPath id="c2"><rect class="r2" x="90" y="0" width="0" height="60"/></clipPath>
  </defs>
  <style>
    text { font: 25px 'Fira Code', monospace; }
    .t1 { fill: #800080; }
    .t2 { fill: #FFC000; }
    .r1 { animation: t1 8s linear infinite; }
    .r2 { animation: t2 8s linear infinite; }
    @keyframes t1 { 0%{width:0} 25%{width:430px} 45%{width:430px} 50%,100%{width:0} }
    @keyframes t2 { 0%,50%{width:0} 75%{width:430px} 95%{width:430px} 100%{width:0} }
  </style>
  <g filter="url(#glow)">
    <text class="t1" x="95" y="38" clip-path="url(#c1)">Aspiring Software Engineer</text>
    <text class="t2" x="95" y="38" clip-path="url(#c2)">CS Student at Queens College</text>
  </g>
</svg>
